<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>No.22</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=search,shopping_cart">
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <header class="cabecera-principal">
        <nav class="menu-izquierda" aria-label="Menú principal">
            <a href="#coleccion">Colección</a>
        </nav>
        <div class="logo">
            <img src="./img/logo.png" alt="Logo de No.22">
        </div>
        <nav class="menu-derecha" aria-label="Acciones de la tienda">
            <a href="#buscar" aria-label="Buscar"><span class="material-symbols-outlined" aria-hidden="true">search</span></a>
            <a href="#carrito" aria-label="Carrito"><span class="material-symbols-outlined" aria-hidden="true">shopping_cart</span></a>
        </nav>
    </header>
    <main>
        <section class="portada">
            <img src="./img/moda-urbana.png" alt="Moda urbana entre torres eléctricas">
        </section>
        <section class="galeria-productos" id="coleccion">
            <h2>Novedades</h2>
            <div class="galeria-contenedor">
                <article class="producto-galeria">
                    <div class="foto-producto"><img src="./img/polo-rosa-frente.png" alt="Polo rosa camuflaje"></div>
                    <h3 class="producto-nombre">Polo Camuflaje Rosa</h3>
                    <p class="producto-precio">€59,00</p>
                    <button class="boton-carrito" type="button">Añadir al carrito</button>
                </article>
                <article class="producto-galeria">
                    <div class="foto-producto"><img src="./img/bota-lateral.png" alt="Bota marrón con cordones rosas"></div>
                    <h3 class="producto-nombre">Botas de Ante No.22</h3>
                    <p class="producto-precio">€129,00</p>
                    <button class="boton-carrito" type="button">Añadir al carrito</button>
                </article>
                <article class="producto-galeria">
                    <div class="foto-producto"><img src="./img/camiseta-raglan-frente.png" alt="Camiseta raglán roja y blanca"></div>
                    <h3 class="producto-nombre">Camiseta Raglán Roja</h3>
                    <p class="producto-precio">€39,00</p>
                    <button class="boton-carrito" type="button">Añadir al carrito</button>
                </article>
                <article class="producto-galeria">
                    <div class="foto-producto"><img src="./img/polo-blanco-frente.jpg" alt="Polo blanco con cuello rosa"></div>
                    <h3 class="producto-nombre">Polo Blanco No.22</h3>
                    <p class="producto-precio">€59,00</p>
                    <button class="boton-carrito" type="button">Añadir al carrito</button>
                </article>
                <article class="producto-galeria">
                    <div class="foto-producto"><img src="./img/bolso-cuadros-1.png" alt="Bolso de cuadros No.22"></div>
                    <h3 class="producto-nombre">Bolso de Cuadros No.22</h3>
                    <p class="producto-precio">€99,00</p>
                    <button class="boton-carrito" type="button">Añadir al carrito</button>
                </article>
            </div>
        </section>
    </main>
    <footer class="pie-pagina">
        <p>© 2026 No.22</p>
    </footer>
</body>
</html>
